<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!-- Tileable doodle pattern in the spirit of the WhatsApp chat wallpaper: faint line icons on a dark teal field.
       All icons stay ≥14px from the tile edge so the repeat has no seams. -->
  <rect width="260" height="260" fill="#0b141a"/>
  <g fill="none" stroke="#8fb3a6" stroke-opacity="0.11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- chat bubble -->
    <g transform="translate(24 26) rotate(-8)"><path d="M0 4a8 8 0 0 1 8-8h22a8 8 0 0 1 8 8v14a8 8 0 0 1-8 8H16l-9 8v-8a8 8 0 0 1-7-8z"/><path d="M9 6h20M9 13h12"/></g>
    <!-- heart -->
    <g transform="translate(112 22) rotate(10)"><path d="M16 28S2 19 2 9a7 7 0 0 1 14-2 7 7 0 0 1 14 2c0 10-14 19-14 19z"/></g>
    <!-- building -->
    <g transform="translate(190 20) rotate(-5)"><rect x="0" y="6" width="30" height="38" rx="2"/><path d="M7 16h4M19 16h4M7 25h4M19 25h4M7 34h4M19 34h4M12 44v-6h6v6"/></g>
    <!-- smiley -->
    <g transform="translate(60 92) rotate(6)"><circle cx="16" cy="16" r="15"/><path d="M10 12v2M22 12v2M9 20q7 8 14 0"/></g>
    <!-- paper plane -->
    <g transform="translate(148 88) rotate(-12)"><path d="M2 16L34 2 26 32 17 21z"/><path d="M17 21L34 2"/></g>
    <!-- key -->
    <g transform="translate(218 98) rotate(35)"><circle cx="8" cy="8" r="7"/><path d="M15 8h22M30 8v7M36 8v5"/></g>
    <!-- music note -->
    <g transform="translate(22 160) rotate(-10)"><path d="M10 28V4l20-4v24"/><circle cx="6" cy="28" r="5"/><circle cx="26" cy="24" r="5"/></g>
    <!-- star -->
    <g transform="translate(100 158) rotate(12)"><path d="M16 1l4.5 10 11 1-8.300 7.500L25.700 31 16 25l-9.700 6 2.500-11.500L0.500 12l11-1z"/></g>
    <!-- elevator doors -->
    <g transform="translate(168 152) rotate(4)"><rect x="0" y="0" width="30" height="40" rx="3"/><path d="M15 0v40M7 -8l4 -4 4 4M19 -8l4 -4"/></g>
    <!-- phone -->
    <g transform="translate(26 216) rotate(8)"><rect x="0" y="0" width="20" height="32" rx="4"/><path d="M7 26h6"/></g>
    <!-- megaphone -->
    <g transform="translate(88 214) rotate(-8)"><path d="M2 10h8l16-8v28l-16-8H2z"/><path d="M10 22l3 10"/></g>
    <!-- lightbulb -->
    <g transform="translate(150 210) rotate(10)"><path d="M12 28v-5c-5-3-8-7-8-12a12 12 0 0 1 24 0c0 5-3 9-8 12v5z"/><path d="M12 33h8"/></g>
    <!-- thumbs / check ticks -->
    <g transform="translate(212 214) rotate(-6)"><path d="M2 14l8 8L26 4"/><path d="M14 22l4 4L34 8"/></g>
  </g>
</svg>
